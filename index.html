pte vraiment aujourd'hui ?"],["orage","Excès","Tempérance","Trop, trop vite, trop fort : je ne sais plus m'arrêter","Où est la juste mesure, celle qui te ferait du bien demain aussi ?"],["vent","Déséquilibre","Équilibre","Tout penche, je perds pied d'un côté puis de l'autre","Qu'est-ce qui te tient debout, au milieu, en ce moment ?"],["nuages","Fadeur","Magnétisme","Je me sens fade, rien n'attire vers moi","Qu'est-ce qui s'allume en toi quand tu parles de ce que tu aimes ?"],["froid","Enfermement","Libération","Comme en cage, je tourne dans la même pièce","Quelle porte est déjà ouverte, que tu n'as pas encore poussée ?"],["brouillard","Déconnexion de soi","Intuition","Je n'entends plus ma petite voix","Que te dit ta petite voix, là, si tu te tais une seconde ?"],["brouillard","Suranalyse","Instinct","Je réfléchis trop, je n'écoute plus mon corps","Que dit ton corps, avant même que ta tête se mette à calculer ?"],["nuages","Extinction","Rayonnement","Ma lumière est basse, je m'éteins","Auprès de qui, ou dans quoi, ta lumière remonte-t-elle toute seule ?"],["vent","Lutte contre le temps","Éveil","Je cours après le temps, jamais au bon moment","Et si ce moment-ci était exactement le bon : qu'est-ce qui est là ?"],["nuages","Inachèvement","Accomplissement","Rien n'est fini, tout reste en suspens","Qu'as-tu mené au bout, un jour, qui compte encore pour toi ?"]].map((e,t)=>({i:t,meteo:e[0],emo:e[1],contraire:e[2],signe:e[3],question:e[4]||"",courant:t<24})),v=["Joie","Calme","Confiance en soi","Courage","Gratitude","Énergie","Amour","Sérénité"].map(e=>A.find(t=>t.contraire===e).i),f={Existence:"Je suis là, et ça compte",Persuasion:"Je dis ce que je pense, calmement, et ça porte","Désir":"Quelque chose m'attire, me tire en avant","Beauté":"Je vois ce qui est beau, en moi et autour",Splendeur:"Je brille, sans forcer",Charisme:"Les gens se tournent vers moi quand je suis moi",Attrait:"Je plais sans chercher à plaire",Puissance:"Je sens ma force, tranquille",Satisfaction:"C'est assez, et c'est bien",Savoir:"Je sais, et je sais aussi ce que je ne sais pas","Connaissance de soi":"Je me connais un peu mieux","Créativité":"Les idées viennent, je fabrique","Ingéniosité":"Je trouve un chemin là où il n'y en avait pas",Influence:"Ce que je dis ou fais touche quelqu'un","Succès":"Ça a marché, et je le vois",Victoire:"J'ai tenu, j'ai gagné quelque chose","Félicité":"Un bonheur plein, sans raison précise",Richesse:"Je suis riche de ce qui compte",Abondance:"Il y en a assez, pour moi et pour les autres",Justice:"C'est juste, pour moi et pour l'autre","Vision d'ensemble":"Je vois le tableau entier, pas qu'un coin","Ouverture d'esprit":"J'écoute ce qui ne me ressemble pas",Sagesse:"Je prends une respiration avant d'agir","Paix avec la mort":"La fin fait partie de la vie, et je suis en paix","Tempérance":"La juste mesure, ni trop ni trop peu","Équilibre":"Je tiens debout, au milieu","Magnétisme":"Quelque chose en moi attire, sans effort","Libération":"La cage est ouverte, je respire large",Intuition:"Je sens avant de savoir",Instinct:"Mon corps sait, je l'écoute",Rayonnement:"Ma lumière déborde un peu sur les autres","Éveil":"Je suis réveillé à ce moment-ci, c'est le bon",Accomplissement:"J'ai mené quelque chose au bout",Joie:"Légèreté, sourire, envie de partager",Calme:"Respiration lente, rien ne presse","Confiance en soi":"Je sais que je peux y arriver",Courage:"J'ai un peu peur, mais j'y vais",Gratitude:"Envie de dire merci","Énergie":"Envie de bouger, de faire",Amour:"Le cœur ouvert, chaud, tourné vers quelqu'un","Sérénité":"Tout est à sa place, je n'attends rien",Patience:"Ça viendra, je peux attendre",Pardon:"Je ne porte plus ce qu'on m'a fait",Admiration:"Ce que fait l'autre m'élève",Lien:"Je me sens relié, compris",Espoir:"Demain peut être meilleur","Présence":"Je suis là, tout entier, maintenant","Clarté":"Je vois ce qu'il y a à faire",Sens:"Ce que je fais compte","Curiosité":"J'ai envie de découvrir","Paix avec soi":"Je me pardonne, je me laisse tranquille","Fierté":"J'ai fait quelque chose de bien","Pouvoir d'agir":"Je peux faire quelque chose",Appartenance:"Je suis à ma place, avec les miens",Respect:"Je vois la valeur de l'autre",Douceur:"Je parle et j'agis sans heurter","Légèreté":"Rien ne pèse, je souris","Détente":"Les épaules descendent, je souffle",Audace:"J'ose, je me lance","Humilité":"Je n'ai rien à prouver",Chaleur:"Je me sens proche, ouvert",Enthousiasme:"Je m'emballe, j'ai envie","Émerveillement":"Les yeux grands ouverts devant ce qui est beau",Soulagement:"Ouf, ça passe, je respire",Amusement:"J'ai envie de rire",Inspiration:"Les idées viennent toutes seules",Contentement:"J'ai ce qu'il me faut",Bienveillance:"Je veux du bien, à moi et aux autres",Tendresse:"Mes gestes sont doux",Apaisement:"La tempête se calme",Confiance:"Ça va aller, je le sens"},b=[["Moi","Je ne suis pas assez bien","Je suis assez, tel que je suis"],["Moi","Je dois être parfait","Faire de mon mieux suffit"],["Moi","Je dérange","Ma place compte aussi"],["Capacités","Je n'y arriverai jamais","Je peux avancer pas à pas"],["Capacités","C'est trop tard pour moi","Il n'est jamais trop tard pour commencer"],["Capacités","Je ne suis pas fait(e) pour ça","Je peux apprendre ce qui m'intéresse"],["Échec","Si je rate, c'est fini","Un échec est une information"],["Échec","Les autres vont se moquer","Ceux qui comptent comprendront"],["Émotions","Un homme ne pleure pas","Pleurer est humain"],["Émotions","Montrer sa peur, c'est être faible","Voir sa peur, c'est du courage"],["Émotions","Il ne faut pas se plaindre","Dire ce qu'on ressent est sain"],["Relations","On ne peut faire confiance à personne","Certaines personnes méritent ma confiance"],["Relations","Si je dis non, on ne m'aimera plus","Dire non protège aussi le lien"],["Relations","Il faut faire plaisir à tout le monde","Je peux aussi me faire plaisir"],["Argent","L'argent, c'est sale","L'argent est un outil"],["Argent","Il faut souffrir pour gagner sa vie","On peut gagner s re fort pour les autres","Je peux être fort et avoir besoin des autres"],["Relations","Les gens finissent toujours par partir","Certains restent"],["Relations","Si je me montre vraiment, on me rejettera","Me montrer permet d'être aimé pour de vrai"],["Relations","Je dois toujours dire oui","Mon oui a de la valeur parce que je peux dire non"],["Relations","Les autres pensent du mal de moi","Les autres pensent surtout à eux"],["Amour","Je ne suis pas aimable","Je mérite l'amour, comme tout le monde"],["Amour","L'amour fait toujours souffrir","L'amour peut aussi être doux et calme"],["Amour","Sans quelqu'un, je ne suis rien","Je suis une personne entière, seule ou accompagnée"],["Amour","Il faut tout accepter par amour","Aimer, c'est aussi se respecter"],["Amour","Je vais finir seul(e)","Mon histoire n'est pas écrite"],["Famille","Je dois rendre mes parents fiers","Ma vie m'appartient"],["Famille","On ne parle pas de ça dans la famille","Je peux ouvrir une nouvelle porte"],["Famille","Je dois réussir là où mes parents ont échoué","Je peux tracer mon propre chemin"],["Famille","La famille passe avant tout, même avant moi","Je compte aussi dans ma famille"],["Famille","Je suis le problème de la famille","Je suis une personne, pas un problème"],["Argent","Les riches sont malhonnêtes","L'argent ne dit rien du cœur"],["Argent","Je ne serai jamais à l'aise","Ma situation peut changer"],["Argent","Parler d'argent, c'est honteux","Parler d'argent, c'est se respecter"],["Argent","Je ne sais pas gérer l'argent","Ça s'apprend, comme le reste"],["Travail","Je dois toujours être occupé","Le repos fait partie du travail"],["Travail","Si je ne suis pas le meilleur, je ne vaux rien","Faire ma part a de la valeur"],["Travail","Mon travail, c'est ce que je suis","Je suis bien plus que mon travail"],["Travail","Je dois dire oui à mon chef, toujours","Je peux dire ce que je pense avec respect"],["Travail","Les autres sont plus légitimes que moi","Ma place, je l'ai gagnée"],["Corps","Mon corps n'est pas beau","Mon corps me porte chaque jour"],["Corps","Je dois tenir, ne pas écouter la fatigue","La fatigue est un message"],["Corps","Les hommes ne prennent pas soin d'eux","Prendre soin de soi est une force"],["Corps","Je suis trop gros, trop maigre, trop…","Mon corps est le mien, il vit"],["Temps","Je n'ai jamais le temps","Je choisis à quoi je donne mon temps"],["Temps","Il est trop tard pour changer","Chaque jour est un début possible"],["Temps","Je dois tout faire vite","Ce qui compte prend le temps qu'il faut"],["Temps","J'ai perdu des années","Ces années m'ont construit"],["Vie","Il faut souffrir pour mériter","La douceur se mérite aussi"],["Vie","Le bonheur, c'est pour les autres","Le bonheur passe aussi par chez moi"],["Vie","On ne peut rien changer","Je peux changer ma façon de voir"],["Vie","Il faut se méfier de la vie","La vie m'a aussi porté"],["Les autres","Ce que pensent les autres compte plus que ce que je pense","Mon regard sur moi compte en premier"],["Les autres","Les autres sont meilleurs que moi","Chacun a sa lumière et son ombre"],["Les autres","Je dois être comme tout le monde","Je peux être moi"],["Les autres","Tout le monde me juge","Les autres ne me regardent pas autant que je le crois"],["Bonheur","Je serai heureux quand j'aurai…","Je peux être heureux en chemin"],["Bonheur","Être heureux, c'est égoïste","Mon bonheur fait du bien autour de moi"],["Bonheur","Ça ne durera pas","Rien ne dure, et c'est ce qui rend chaque moment précieux"]].map((e,t)=>({k:t,theme:e[0],idee:e[1],autre:e[2],courant:t<12})),h=[...new Set(b.map(e=>e.theme))],g=["Ma famille","L'école","Mes amis","La société, les médias","Le travail","Moi-même","Je ne sais pas"],$=[(e,t)=>`Où est « ${e} » en toi, maintenant, même tout petit ?`,(e,t)=>`Quand as-tu ressenti « ${e} » pour la dernière fois ? Qu'est-ce qui était là, à ce moment ?`,(e,t)=>`Si « ${e} » pouvait parler à « ${t} », que lui dirait-il ?`,(e,t)=>`Qui, dans ta vie, te montre « ${e} » ? Qu'est-ce que tu vois chez cette personne ?`,(e,t)=>`Que ferait « ${e} » à ta place, dans cette situation ?`,(e,t)=>`Où, dans ton corps, pourrait se cacher « ${e} » ?`,(e,t)=>`Qu'est-ce que « ${t} » essaie de protéger ? Et comment « ${e} » pourrait-il le protéger autrement ?`],x=[(e,t)=>`Où se cache « ${e} » en toi, même un tout petit peu ? Le regarder n'éteint pas « ${t} ».`,(e,t)=>`Aujourd'hui tu sens « ${t} ». Quand « ${e} » reviendra, qu'est-ce que tu aimerais te rappeler ?`,(e,t)=>`« ${t} » et « ${e} » dorment dans la même pièce. Qu'est-ce que « ${e} » a à te dire, aujourd'hui ?`];function q(e){const t=gt.entrees.filter(t=>t.paire===e.i).length;return 0===t&&e.question?e.question:$[(t+e.i)%$.length](e.contraire.toLowerCase(),e.emo.toLowerCase())}function j(e){const t=gt.entrees.filter(t=>t.paire===e.i).length;return x[(t+e.i)%x.length](e.emo.toLowerCase(),e.contraire.toLowerCase())}const y=[["Nommer","Mettre un mot sur ce que tu ressens, c'est déjà allumer la lampe. Tant que l'émotion n'a pas de nom, elle est partout. Dès qu'elle en a un, elle a une place.","Aujourd'hui, nomme ton émotion avec un seul mot. Même s'il n'est pas parfait."],["« Je vois » au lieu de « je suis »","Tu n'es pas la colère. Tu es celui qui la voit. Dire « je suis en colère », c'est devenir la colère. Dire « je vois la colère », c'est rester toi.","Pendant le rituel, lis la phrase « Je vois… » à voix basse, et sens la différence."],["Le corps parle en premier","Une émotion commence dans le corps : la gorge, le ventre, la mâchoire, les épaules. Le corps le sait avant la tête.","Avant de choisir ton émotion, ferme les yeux 10 secondes et cherche où ça se passe dans ton corps."],["La météo passe","Aucune météo ne dure toujours. Un orage n'est pas le ciel : il le traverse. Toi, tu es le ciel.","Remarque combien de temps dure ton émotion aujourd'hui. Elle a un début et une fin."],["L'idée est une voix","Une idée entendue, c'est une voix enregistrée en toi. Elle parle, mais ce n'est pas toi qui parles. Tu peux l'écouter comme on écoute la radio.","Quand une phrase te vient (« je ne suis pas assez bien »), demande-toi : qui parle, là ?"],["D'où vient la voix ?","Famille, école, amis, télé… Chaque idée entendue a une origine. Voir d'où elle vient, c'est déjà s'en détacher un peu.","À l'étape des idées, choisis d'où vient la voix. Sans juger, juste pour voir."],["Pas de lutte","Observer, ce n'est pas lutter. Tu ne pousses rien dehors. Tu allumes la lumière et tu regardes. Ce qu'on combat grandit ; ce qu'on regarde s'apaise.","Si tu as envie de chasser l'émotion, note-le, puis regarde-la encore 5 secondes, sans rien faire."],["Le contraire est dans la même pièce","La peur et le courage dorment dans le même lit. La tristesse et la joie aussi. Voir l'un, c'est pouvoir voir l'autre : ils ne sont jamais loin.","Quand tu vois ton émotion, cherche son contraire tout de suite après. Il est là, même minuscule."],["Les deux ensemble","Tenir les deux sans choisir, c'est ça la sagesse : « je vois la peur et je vois le courage ». Ni l'un ni l'autre n'a besoin de gagner.","À l'étape « Vois les deux », reste 10 secondes avec les deux mots, sans en préférer un."],["L'espace entre deux pensées","Entre deux idées, il y a un petit silence. C'est là que tu es, toi : avant la pensée, après la pensée.","Pendant le souffle, écoute le petit espace entre une pensée et la suivante."],["L'observateur dans la journée","Le rituel est un entraînement. La vraie pratique, c'est dans la journée : au feu rouge, dans la file, avant de répondre.","Trois fois aujourd'hui, demande-toi : quelle est ma météo, là ? Rien d'autre."],["La lumière qui regarde","Tu n'es ni l'émotion ni l'idée. Tu es la lumière qui les voit. Elle était là depuis le début, avant même que tu ouvres les yeux.","Aujourd'hui, à la fin du rituel, dis-toi : je suis la lumière qui voit. Et reste là un instant."]],J=[["Pour aller mieux, il faut chasser l'émotion désagréable.",!1,"On ne chasse rien : on allume la lumière et on regarde. Ce qu'on combat grandit, ce qu'on regarde s'apaise."],["Dire « je vois la colère » plutôt que « je suis en colère », ça change quelque chose.",!0,"Dire « je suis », c'est devenir l'émotion. Dire « je vois », c'est rester celui qui regarde."],["Une émotion commence souvent dans le corps, avant la tête.",!0,"La gorge, le ventre, la mâchoire, les épaules : le corps le sait en premier."],["Une idée entendue, c'est forcément une vérité sur moi.",!1,"C'est une voix enregistrée en toi : elle parle, mais ce n'est pas toi qui parles."],["Le contraire d'une émotion est toujours très loin d'elle.",!1,"La peur et le courage dorment dans le même lit. Voir l'un, c'est pouvoir voir l'autre."],["Une météo intérieure peut durer toujours.",!1,"Aucune météo ne dure toujours. L'orage traverse le ciel ; toi, tu es le ciel."],["Voir d'où vient une idée entendue aide à s'en détacher.",!0,"Famille, école, télé… Voir l'origine, c'est déjà prendre un pas de recul."],["Nommer son émotion avec un mot, c'est déjà un pas.",!0,"Tant qu'elle n'a pas de nom, elle est partout. Dès qu'elle en a un, elle a une place."],["Tenir les deux côtés sans choisir, c'est de l'indécision.",!1,"C'est la sagesse : « je vois la peur et je vois le courage ». Aucun des deux n'a besoin de gagner."],["Le rituel suffit : pas besoin d'observer dans la journée.",!1,"Le rituel est un entraînement. La vraie pratique, c'est au feu rouge, dans la file, avant de répondre."],["Je suis l'émotion que je ressens.",!1,"Tu n'es ni l'émotion ni l'idée : tu es la lumière qui les voit."],["Entre deux pensées, il y a un petit silence où je suis.",!0,"Avant la pensée, après la pensée : c'est là que tu es, toi."],["Observer une émotion, c'est lutter contre elle.",!1,"Observer, ce n'est pas lutter. Tu ne pousses rien dehors, tu regardes."],["Une émotion a un début et une fin.",!0,"Remarque combien de temps elle dure : elle passe, comme la météo."],["Quand on regarde une émotion, elle grossit.",!1,"C'est l'inverse : ce qu'on regarde s'apaise, ce qu'o
